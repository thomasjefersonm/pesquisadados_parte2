[project]
name = "pesquisadados-parte2"
version = "0.1.0"
description = "Apache Spark com SQL Server, MinIO e Delta Lake - Engenharia de Dados SATC"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.34",
    "delta-spark==3.2.1",
    "pandas>=2.2",
    "pyodbc>=5.1",
    "pyspark==3.5.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "mkdocs>=1.6",
    "taskipy>=1.13",
]

[tool.taskipy.tasks]
up = "docker compose up -d"
down = "docker compose down"
lab = "jupyter lab --allow-root"
docs = "mkdocs serve"
deploy = "mkdocs gh-deploy"
